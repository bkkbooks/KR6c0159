body:
  text: 閩劍一笠道人默壺謝子觀光釋武林有髮僧了幻前進士胡孝校佛謂世間一切男女無分貴賤但肯一念觀心則其人自性就在不用擬議安排何也自性在窮應物有主則事不能擾何安樂如之此觀字法門即萬行之樞也清涼云萬行束為六度六度攝歸三學戒定慧也三學攝歸止觀止觀本乎一心止乃伏結之初門觀乃斷惑之正要苟修止觀萬事畢矣人若一念不觀則心已惑於物心既溺物諸惱兢臻自在之樂安可得乎今學觀者勿觀之目宜觀之心心觀其體即得自在忘體觀物即生煩惱觸目皆物孰能不觀惟觀不悖體用即靈妙如是觀心立成佛道經云平等真法界無行無能到若能間觀心能行亦能到略疏以觀自在菩薩為句者指觀心之人也非實有一菩薩以承其名耳儂謂觀自在一句乃學佛之綱領也行深般若者乃修菩薩之綱領也今之欲修菩薩之道者其法頗繁須要先行法空深般若之智慧得波羅蜜多到寂淨涅槃彼岸之時然後始能照見五蘊之陰翳原無體質依人之性而生今證涅槃則彼諸蘊隨照皆歸空假惟有涅槃獨露蓋因先證涅槃次破五蘊然後始度脫一切罣礙恐怖顛倒夢想之苦厄不是先度苦厄故略疏云證見真空苦惱斯盡始遠離分段變易二種生死今之學者下手即泥閉目靜坐掃除妄想希俟妄盡而見真性如是行者大違佛旨豈知妄若塵沙以衆生知見焉能出脫儂謂欲除塵妄須證涅槃欲證涅槃須行般若般若不行則涅槃不證涅槃不證則苦厄難除所以心經以般若為宗矣此上二節略疏目為略標綱要分即學佛學菩薩之二綱領也下文廣陳實義分即其教中八條目也心經義理離諸禪律純粹輕清非上智莫能了佛會上智舍利子其人也彼時佛將廣陳條目特呼智慧第一之弟子舍利子曰夫色蘊不異乎真空真空亦不異乎色蘊此一節略疏目為空假無礙觀佛又曰色蘊即是真空此節從假入空觀真空即是色蘊此節是從空入假觀其餘四蘊佛省文總括之曰受想行識之四蘊亦復如是色蘊四轉語一般而轉矣此節因上文五蘊皆空及觀字法門而發也略疏曰觀色即空以成止行觀空即色以成觀行空色無二即止觀俱行方為究竟也夫色空二字學者自須明白切勿隨聲附和此色不異空之空不是沒有了乃人人身中真性實有之名也色者非特眼見者是聲香觸法皆色也乃身外一切事物之名也所謂不異又曰即是乃教人和光同塵混色融空之意切忌避喧趨寂此是醫那除妄想求真性者之病也學者若悟般若以般若涉事即事亦成般若若明事即般若應物亦無妄矣慧燈云事虗而理實以實應虗如水奪波波相自盡解斯法者不動步可疾證菩提但此心境一如之空如來藏障重福薄者難當佛憫我等不悟衣中之珠重呼舍利子形容此實相如來藏佛告舍利子曰是諸五蘊之法塵若空了之時定要顯出一個空了之相狀出來方契實際之理不然即墮在那法空之空中去矣此相非空非有甚難形容佛於下文提出不生不滅等兩頭機證出中間之奇貨儂謂此節乃是直指實相門略疏就位釋不生不滅謂在道前凡夫位以諸凡夫死此生彼流轉長劫是生滅位真空離此故云不生不滅儂就性釋謂諸聲聞小乘迷時逐物妄起則為生悟時離物妄息則為滅因其未證空相不生即滅不滅即生動靜只此兩頭忙若具真空實相者應物動時見透物是有外緣虗假不隨物往以其有空相表之耳雖曰念生其實生亦不生應了念慮靜時似乎寂滅彼滅中却有實相故滅亦不滅略疏就位釋不垢不淨謂在道中菩薩等位障染之垢雖未消盡而清淨之行已修名垢淨位真空離此故云不垢不淨儂就性釋以緣覺中乘之人厭喧求寂故其知見有垢有淨惟悟空相之人應物居塵之時亦不見其污垢應了心性恬靜之時亦不見其清淨略疏就位釋不增不減謂在道後佛果位中生死惑障昔未盡而今盡是減也修生萬德昔未圓而今圓是增也真空離此故云不增不減儂就性釋謂上乘之人悟則明生似乎有增迷即明失似乎有減若證真空實相之人以實相非因聖有故在聖位之時不見其有所增長性相本來具足故在凡位亦不見其有所減缺夫證實相之相者不淪空不滯有謂之清淨妙色身佛謂惟此一事實餘二即非真孰能信悟踐此真空實相之形者五蘊不照而自空六根不滌而自淨六塵不掃而自清六識不轉而自智無量法門皆為此真空實相之相一法之所攝也是故此真空實相之中無諸色蘊之障亦無受想行識之障有此實相之法即不用餘法故曰亦無滌眼耳鼻舌身意六根之法亦無掃色聲香味觸法六塵之法亦無轉十八界中眼界之小法乃至無轉意識等十八界之法略疏目此節為法相開合門夫空相門中非特無此數法而已亦無十二因緣法中無明之可破何也夫無明一悟即是真空真空一迷復成無明無明既因迷而右因悟而無雖無定體心若一迷無明即至固不可言其絶盡無矣故曰亦無無明盡夫此空相無明原非兩物永嘉曰無明實性即佛性幻化空身即法身此言甚覺有味苦厄生於無明故無明乃是十二因緣之首惡今悟空相既已無之則其餘黨緣行緣識緣名色緣六入緣觸緣受緣愛緣取緣有亦皆無之非但無此止矣乃至無諸老死人既有身必有老死今說無之佛就性言以人真性萬劫不壞無死無生故曰無老死本性雖無老死色身未免有老死豈可謂其絶盡無矣故曰亦無老死盡此節略疏目為緣起逆順門非但已上諸法不若實相省力至於四諦之法雖為大乘之法寶真空亦能兼攝故曰實相門中亦無苦集滅道四諦之法也此節略疏目為染淨因果門詳解在釋疑中下文無智亦無得一節略疏目為境智能所門外境即所也內智即能也學者由有般若內能之智而見實相之理因得此理始無已上外境諸法之所法所今既無之猶存智理未去此節甚難形容為設一喻實見之理喻藥方諸法之擾喻疾病般若之智喻藥石法空何用般若即病愈不可復藥無病服藥恐因藥致生他病法今既空般若須罄即無智也般若雖罄實見之理猶存如藥去而方尚在今者若併其所得之方亦俱無之正如剝芭蕉始剝到此無下手處惟露出那無病無藥無方之奇貨故曰無智亦無得學者學到這箇無所得之田地邃寂孤危行人絶跡實無問津處自要抖擻精神睜眼作個主張不然即跌落那昏懵深坑去萬劫不得出頭來莫恨某甲今日不說破要逃生死苦須由這條路上過躲閃不得下文以無所得故一節是牒前起後之句略疏謂以者由也故者所以也謂了生死之學者由前以無所得為因故後所以能得涅槃菩提之果此二果伏無所得而得也學者若存少有得之心即為其所礙二果不可得矣此經以無所得三個字結於法未獨無旨乎即瞿曇老婆心切處圭峰云般若以無所得為方便圓覺以離相為方便者是也夫菩提薩埵造無所得地由依那般若波羅蜜多時故其心中始無一切名利嗜欲喜怒愛惡之罣礙因其無諸罣礙了故才無有患得患失恐懼怖畏之心矣菩薩工夫到此惑不礙心境不礙智外無魔怨之怖即惡緣息也由此始能遠離聲色顛倒醉夢之情想到此地內無惑障之倒即惡因盡也這其間始究竟窮盡菩薩所證無死無生涅槃圓寂自在之斷果夫十方三世一切諸佛造無所得之地亦由依那般若波羅蜜多了故才證得本來之阿耨多羅三藐三菩提無上正等正覺之智果龍舒居士注梵語阿此云無也耨多羅上也三正也藐等也菩提覺也詳言之曰無上正等正覺略言之曰覺也以人人真性無得而上之故云無上然上自十方諸佛下至蠢動含靈此性正相平等故云正等覺性圓明普照無去無來大周沙界小入毫苦故云正覺得此正覺之果者所以為佛即此三界而離三界不復輪回矣已上之文乃是有義理之顯般著令人循文解義依法修持篤信力行者則魔網自裂五蘊頓空六根漸爭苦厄潛消佛果必證已下所說之呪謂之密般若密者祕密也謂不可解說但令信心持誦自然災業除福慧長有陰助行人進道之功若貪嗔癡鈍宿業染習深重未除者不藉此神呪之力而能得脫其韁鎖者決無是理也佛於下文先讚密般若呪力之勝妙曰故知此密般若波羅蜜多之神呪不比尋常之呪乃是解宿世冤業有大神力之呪是豁人心一切愚鈍之大明呪諸經皆有神呪更無一呪高妙過於此呪者故曰是無更有在此上之呪也是無更有與此般若呪平等一般等平之呪也此呪能除三界衆生一切煩惱災障苦厄之呪我此讚呪勝妙之語皆是真實之言不是虗誑之語也世尊贊此呪已故即說此密般若波羅蜜多之呪即說其呪曰揭諦揭諦波羅揭諦波羅僧揭諦菩提薩婆訶默老所釋心經理直義貫甚利初機由茲始達本文二百六十字獨闡般若實諸佛菩薩成果之正因雖辟支緣覺聲聞尚未知有其要凡夫闡提外道豈能傾信其神又非高遠在人一念轉間顯密果能併行不悖者非佛口所生之子而何了幻僧跋
