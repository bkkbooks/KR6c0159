body:
  text: 般若波羅蜜多心經略疏序唐翻經沙門賢首大師法藏著夫以真源素範沖漠隔於筌妙覺玄猷奧賾超於言象雖真俗雙泯二諦恆存空有兩亡一味常顯良以真空未嘗不有即有以辨於空幻有未始不空即空以明於有有空有故不有空有空故不空不空之空空而非斷不有之有有而非常四執既亡百非俱遣般若玄旨斯之謂歟若歷事備陳言過二十萬頌若撮其樞要理盡一十四行是知詮真之教乍廣略而隨緣超言之宗性圓通而俱顯般若心經者實謂曜昏衢之高炬濟苦海之迅航拯物導迷莫斯為最然則般若以神鑑為體波羅蜜多以到彼岸為功心顯要妙所歸經乃貫穿言教從法就喻詮旨為目故云般若波羅蜜多心經此序文約義豐辭無枝葉玩其真空未嘗不有即有以辨於空云云十二轉語撥出一個真空實相親切嚴密非具雙眼者莫能言也愚每誦斯文爽酥毛骨得其印券者多矣固不可掩師之善亦不敢自私於心敬録卷端以公天下為後來同志者的觀光般若波羅蜜多心經釋義序佛説心經首尾五十三言能了一十二部大藏經中之妙義非他經可比故謂之了義心經經謂之心者心所以至宰乎一身而運用乎百骸者也夫心之時義大矣哉何後之注解者與經文無所發明惟唐高僧賢首諱法藏者所注心經略疏及真覺諱文才者注慧燈集盡略疏之詳此二家之注不離本文義理切實但言淡意清科條繁細初機學者神流氣矂一時觀之無入頭處其次如潛溪宋先生會賢首宗泐孤山古雲等諸師之解而為解者其義雖明不無闕略噫甚矣此經之不可以漫然注解而注解者之難也且佛經三藏曰經曰律曰論凡謂之經與律者皆世尊金口宣揚一入阿難尊者之耳始終不訛一字佛至雙林敕阿難將四十九年所説之法彚集成經凡諸經首必用如是我聞四字蓋示以述而不作之意也又佛住世時在會菩薩如文殊普賢觀音勢至等為十方無量菩薩之首俱未見其説法縱有所説非佛之言阿難安敢收攝入藏以水參乳乎爰是而知心經為世尊所説無疑矣不然何略疏謂此一十四行之經其文雖簡而義悉備即能統攝六百卷中之要妙則此即諸經之總持也略疏又以觀自在至度一切苦厄目為略標綱要分舍利子已下目為廣陳實義分據此條目綱領而詳之始知心經之脈絡所謂開萬古之群蒙者此耳蓋心經之旨在於般若三世諸佛依之即得菩提十地菩薩依之即證涅槃明般若者四諦等法皆不足憶也故曰千日學法不如一日學般若出世之流可踰般若而慕他法乎愚以淺見薄識豈敢好異與老宿強辨亦不敢妄為注解以愚後來惟據賢首文才二師之解而衍説之間有竊附己意補其闕略亦乃一得之愚庶使初機學者不至如矮人觀場未必無小補云時萬曆丁亥春福建延乎默壺謝觀光書于錢塘紫陽洞天深處
